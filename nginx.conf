server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # o jogo é um arquivo único: atualizações precisam chegar na hora
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # símbolos SVG podem ficar em cache por um dia
  location /assets/ {
    add_header Cache-Control "public, max-age=86400";
  }

  # qualquer caminho (inclusive o SSO ?t=...&nome=...) cai no jogo
  location / {
    try_files $uri $uri/ /index.html;
  }
}
